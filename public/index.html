<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#5b6cff"><title>अर्थ — ज़िंदगी 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Devanagari','Mangal','Nirmala UI',system-ui,sans-serif;background:linear-gradient(180deg,#eef1ff,#f8f4ff);color:#2a2d3e;min-height:100vh;font-size:17px;line-height:1.55;padding-bottom:74px}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 20px}
#stats{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);box-shadow:0 2px 12px rgba(80,90,180,.12);padding:8px 12px;border-radius:0 0 16px 16px;max-width:560px;margin:0 auto}
.srow{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:4px;gap:6px}
.pill{background:#5b6cff;color:#fff;border-radius:20px;padding:2px 10px;font-size:13px;white-space:nowrap}
.pill.g{background:#e8f8ef;color:#12855a}.pill.o{background:#fff3e0;color:#b26a00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.st{font-size:13px}.st b{float:right}
.bar{height:8px;background:#e6e8f3;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;transition:width .6s}
.card{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 4px 18px rgba(80,90,180,.10);animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rand{background:linear-gradient(135deg,#fff7e0,#ffe9c7);border:2px solid #ffc861}.rand.bad{background:linear-gradient(135deg,#ffecec,#ffdcdc);border-color:#ff8a8a}
h1{font-size:26px;text-align:center;margin:22px 0 4px;color:#4450d8}h2{font-size:19px;margin-bottom:8px;color:#3b3f9e}
.btn{display:block;width:100%;min-height:52px;margin-top:10px;padding:12px 14px;font:inherit;font-size:17px;border:none;border-radius:14px;background:#5b6cff;color:#fff;text-align:left;cursor:pointer;box-shadow:0 3px 0 #3d4bd0}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3d4bd0}.btn:disabled{opacity:.5}
.btn.alt{background:#eef0ff;color:#3b3f9e;box-shadow:0 3px 0 #c9cdf5}.btn.c{text-align:center}
.btn.red{background:#e5484d;box-shadow:0 3px 0 #b3343a}.btn.grn{background:#22a565;box-shadow:0 3px 0 #17784a}
.sm{display:inline-block;width:auto;min-height:48px;padding:8px 14px;font-size:15px;margin:6px 6px 0 0}
input,textarea{width:100%;font:inherit;padding:12px;border:2px solid #d6d9f5;border-radius:12px;min-height:50px;margin-top:6px}
.g3{display:flex;gap:8px}.g3 .btn{text-align:center;flex:1}.g3 .btn.sel{background:#2f3bb8;color:#fff}
.fx{margin-top:10px;font-size:15px;font-weight:700}.fx span{display:inline-block;margin:2px 6px 2px 0;padding:2px 8px;border-radius:10px}
.fx .p{color:#12855a;background:#e3f7ee}.fx .n{color:#c0392b;background:#fdeaea}
.li{background:#fff;border-left:4px solid #b7befa;border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:14px}.li.k{border-color:#ffb547}
.small{font-size:13px;color:#777}.flags{font-size:13px;color:#555;margin-top:8px}
.score{font-size:40px;text-align:center;font-weight:800;color:#4450d8}
.tl div{font-size:14px;padding:4px 0;border-bottom:1px dashed #ddd}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;box-shadow:0 -2px 12px rgba(80,90,180,.15);z-index:6}
nav button{flex:1;min-height:62px;border:none;background:none;font:inherit;font-size:13px;color:#777;position:relative}
nav button.on{color:#4450d8;font-weight:700}nav button b{display:block;font-size:22px}
.dot{position:absolute;top:6px;right:22%;background:#e5484d;color:#fff;border-radius:10px;font-size:11px;padding:0 6px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.pl.sl{opacity:.45}
.av{width:44px;height:44px;border-radius:50%;background:#eef0ff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;position:relative}
.av i{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:#bbb}.av i.on{background:#2ecc71}
.pl .nm{flex:1;min-width:0}.pl .nm small{display:block;color:#888;font-size:12px}
.chat{height:52vh;overflow-y:auto;background:#f6f7ff;border-radius:12px;padding:8px;margin-top:8px}
.bub{max-width:80%;padding:8px 12px;border-radius:14px;margin:4px 0;font-size:15px;background:#fff;word-wrap:break-word}.bub.me{margin-left:auto;background:#5b6cff;color:#fff}
.row{display:flex;gap:8px}.row input{flex:1}.row .btn{width:auto;margin-top:6px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#2a2d3e;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;font-size:15px;display:none;max-width:90%}
#conn{position:fixed;top:0;left:0;right:0;background:#e5484d;color:#fff;text-align:center;font-size:13px;padding:3px;z-index:21;display:none}
#call{position:fixed;inset:0;background:linear-gradient(160deg,#3b3f9e,#5b6cff);color:#fff;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#call .big{font-size:72px}#call .btn{max-width:320px}
.belly{font-size:90px;text-align:center;animation:beat 1.6s infinite}@keyframes beat{50%{transform:scale(1.07)}}
.months{display:flex;gap:4px;margin:12px 0}.months span{flex:1;height:10px;border-radius:5px;background:#e6e8f3}.months span.on{background:#f48fb1}
.feed .li{border-color:#9be3c0}

/* ---- 3D shell ---- */
html,body{height:100%;overflow:hidden}
body{padding:0;background:#9fc7ef;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
#c3d{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#stats{position:fixed;left:0;right:0;top:0;background:rgba(255,255,255,.88);z-index:7}
#pw{position:fixed;left:0;right:0;top:44px;bottom:62px;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:4;background:rgba(238,241,255,.86);touch-action:pan-y;-webkit-user-select:text;user-select:text}
body.city #pw{display:none}
#pclose{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;max-width:560px;margin:0 auto;padding:6px 12px 0}
#pclose button{min-height:44px;border:none;border-radius:22px;background:#2a2d3e;color:#fff;font:inherit;font-size:14px;padding:6px 14px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ctl{display:none}body.city .ctl{display:block}
#joy{position:fixed;left:18px;bottom:86px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);z-index:5;touch-action:none}
#knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.25)}
#run{position:fixed;right:18px;bottom:96px;width:76px;height:76px;border-radius:50%;border:none;background:rgba(91,108,255,.85);color:#fff;font:inherit;font-weight:700;font-size:15px;z-index:5;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#run.on{background:#e5484d}
#qb{position:fixed;right:14px;top:206px;min-height:44px;padding:6px 12px;border:none;border-radius:22px;background:rgba(255,255,255,.85);color:#555;font:inherit;font-size:13px;z-index:5}
#lookb{position:fixed;right:14px;top:150px;min-height:48px;padding:6px 14px;border:none;border-radius:24px;background:rgba(255,255,255,.9);color:#3b3f9e;font:inherit;font-weight:700;font-size:14px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#meet{position:fixed;left:50%;transform:translateX(-50%);bottom:200px;z-index:5;display:none;min-height:50px;padding:10px 18px;border:none;border-radius:26px;background:#22a565;color:#fff;font:inherit;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:150px;z-index:5;background:rgba(42,45,62,.82);color:#fff;border-radius:14px;padding:6px 14px;font-size:14px;max-width:88%;text-align:center;pointer-events:none}
#zoneBanner{display:block;background:#fff3e0;color:#b26a00;border-radius:12px;padding:6px 12px;margin-top:10px;font-weight:700;font-size:15px}
nav{z-index:8}nav button.city{color:#22a565}
</style></head><body>
<div id="conn">🔌 कनेक्शन टूटा — फिर से जोड़ रहे हैं…</div><div id="toast"></div>
<div id="stats" style="display:none"></div>
<canvas id="c3d"></canvas>
<div id="pw"><div id="pclose"><button id="pcb">✕ शहर में घूमें 🏙️</button></div><div class="wrap" id="app"><h1>🌧️ ज़िंदगी ऑनलाइन</h1><p class="small" style="text-align:center">सर्वर से जुड़ रहे हैं…</p></div></div>
<div class="ctl" id="joy"><div id="knob"></div></div><button class="ctl" id="run">🏃 दौड़</button><button class="ctl" id="lookb">👗 लुक</button><button class="ctl" id="qb">⚙️ ऑटो</button><button id="meet"></button><div class="ctl" id="hint"></div>
<nav id="nav" style="display:none">
 <button data-city="1" class="city"><b>🏙️</b>शहर</button> <button data-tab="life" class="on"><b>🧬</b>जीवन</button><button data-tab="world"><b>🌍</b>दुनिया</button>
 <button data-tab="people"><b>👥</b>लोग<span class="dot" id="dP" style="display:none"></span></button><button data-tab="chat"><b>💬</b>संदेश<span class="dot" id="dC" style="display:none"></span></button>
</nav>
<div id="call"></div>
<audio id="remote" autoplay playsinline></audio>
<script>
"use strict";
var PANEL=true,ZONE=null;function mustPanel(){return !ME||ME.state!=="alive"}
function setPanel(v){if(!v&&mustPanel())v=true;PANEL=v;document.body.classList.toggle("city",!v);var c=document.getElementById("pclose");if(c)c.style.visibility=mustPanel()?"hidden":"visible"}
function fitPanel(){var st=$("stats"),h=st&&st.style.display!=="none"?st.offsetHeight:0;$("pw").style.top=h+"px"}
window.openLife=function(z){ZONE=z;tab="life";chatWith=null;setPanel(true);render()};window.onPoses=null;window.onFeed=null;
var viewP=false,ws=null,ME=null,W={feed:[]},PL=[],TOK=null,ICE=[{urls:'stun:stun.l.google.com:19302'}],tab='life',chatWith=null,HIST={},unread={},gsel='r',retry=0,waitT=null,lastMeAt=0;
try{var q=new URLSearchParams(location.search).get('token');if(q)localStorage.setItem('zt',q);TOK=localStorage.getItem('zt')}catch(e){}
try{var q0=new URLSearchParams(location.search).get('admin');if(q0){localStorage.setItem('zadmin',q0);history.replaceState(null,'',location.pathname)}}catch(e){}
function $(i){return document.getElementById(i)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){n=Math.round(n||0);var neg=n<0;n=Math.abs(n);var s=String(n),l=s.slice(-3),r=s.slice(0,-3);if(r)l=r.replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+l;return (neg?'-':'')+l}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},3200)}
function S(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=function(){retry=0;$('conn').style.display='none';if(TOK)S({t:'hello',token:TOK});else signup()};
 ws.onclose=function(){$('conn').style.display='block';setTimeout(connect,Math.min(10000,1000*Math.pow(2,retry++)))};
 ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}on(m)};
}
setInterval(function(){S({t:'ping'})},20000);
function on(m){
 if(m.t==='auth'){TOK=m.token;try{localStorage.setItem('zt',TOK)}catch(e){}ICE=m.ice||ICE;$('nav').style.display='flex';try{var ak=localStorage.getItem('zadmin');if(ak)S({t:'admin',key:ak})}catch(e){}}
 else if(m.t==='auth_fail'){TOK=null;try{localStorage.removeItem('zt')}catch(e){}signup()}
 else if(m.t==='me'){ME=m;setPanel(mustPanel()?true:PANEL);lastMeAt=Date.now();var n=(m.friendReq.length+m.proposals.length);$('dP').style.display=n?'block':'none';$('dP').textContent=n;if(tab==='life'||(tab==='people'&&!viewP))render();else renderStats()}
 else if(m.t==='world'){W=m.w;if(tab==='world')render();renderStats()}
 else if(m.t==='tick'){W.day=m.day;W.year=m.year;W.active=m.active;W.births=m.births;W.deaths=m.deaths;renderStats();if(tab==='world'){var x=$('wclock');if(x)x.innerHTML=clockHtml()}}
 else if(m.t==='feed'){if(window.onFeed)window.onFeed(m.item);W.feed.unshift(m.item);W.feed.length=Math.min(W.feed.length,40);if(tab==='world')render();else if(m.item.kind!=='preg')toast(m.item.text)}
 else if(m.t==='players'){PL=m.list;if((tab==='people'&&!viewP)||tab==='chat')render();renderStats()}
 else if(m.t==='msg'){var o=m.m.from===ME.id?m.m.to:m.m.from;(HIST[o]=HIST[o]||[]).push(m.m);
  if(tab==='chat'&&chatWith===o)drawChat();else if(m.m.from!==ME.id){unread[o]=(unread[o]||0)+1;toast('💬 '+(m.fromName||'')+': '+m.m.text);dots()}}
 else if(m.t==='hist'){HIST[m.with]=m.msgs;if(chatWith===m.with)drawChat()}
 else if(m.t==='notif')toast(m.text);
 else if(m.t==='err')toast('⚠️ '+m.text);
 else if(m.t==='profile')showProfile(m);
 else if(m.t==='rtc')rtc(m);
 else if(m.t==='poses'){if(window.onPoses)window.onPoses(m.list)}
}
function dots(){var n=0;for(var k in unread)n+=unread[k];$('dC').style.display=n?'block':'none';$('dC').textContent=n}
function signup(){$('nav').style.display='none';$('stats').style.display='none';setPanel(true);setTimeout(fitPanel,0);
 $('app').innerHTML='<h1>🌧️ ज़िंदगी ऑनलाइन</h1><p class="small" style="text-align:center">एक साझा दुनिया जहाँ असली लोग जीते हैं</p><div class="card"><h2>तुम्हारा नाम?</h2><input id="nm" maxlength="20" placeholder="नाम लिखो"><h2 style="margin-top:14px">लिंग</h2><div class="g3"><button class="btn alt" data-g="m">👦 लड़का</button><button class="btn alt" data-g="f">👧 लड़की</button><button class="btn alt sel" data-g="r">🎲 कोई भी</button></div><p class="small" style="margin-top:10px">⏳ जन्म से पहले माँ के गर्भ में 9 महीने (असली 3 दिन) इंतज़ार करना होगा।</p><button class="btn c" id="go">गर्भ में आओ 🤰</button></div>';
 document.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-g]').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');gsel=b.dataset.g}});
 $('go').onclick=function(){var n=$('nm').value.trim();if(!n)return toast('नाम लिखो');S({t:'signup',name:n,g:gsel,look:window.__look||'normal'})};
 var lb=document.createElement('button');lb.className='btn alt c';lb.id='slook';var setLbl=function(){var L=(window.ZLOOKS||{})[window.__look||'normal'];lb.textContent='👗 लुक: '+(L?L.n:'सामान्य')};setLbl();$('go').parentNode.insertBefore(lb,$('go'));
 lb.onclick=function(){if(window.openLookPicker)window.openLookPicker(window.__look||'normal',function(k){window.__look=k;if(window.ZLOOKS[k].model==='f'){gsel='f'}else if(window.ZLOOKS[k].model==='m'){gsel='m'}document.querySelectorAll('[data-g]').forEach(function(x){x.classList.toggle('sel',x.dataset.g===gsel)});setLbl()})};
}
function bar(l,v,c){return '<div class="st">'+l+' <b>'+v+'</b><div class="bar"><i style="width:'+v+'%;background:'+c+'"></i></div></div>'}
function renderStats(){setTimeout(fitPanel,0);var st=$('stats');if(!ME){st.style.display='none';return}st.style.display='block';
 var top='<div class="srow"><span>'+esc(ME.name)+' '+(ME.g==='m'?'👦':'👧')+'</span><span class="pill g">🟢 '+(W.active||0)+' सक्रिय</span><span class="pill o">🌍 वर्ष '+(W.year||1)+' · दिन '+(W.day||0)+'</span></div>';
 var L=ME.life;if(!L){st.innerHTML=top;return}
 var mp=Math.max(2,Math.min(100,Math.round(Math.log10(Math.max(1,L.money))*14)));
 st.innerHTML=top+'<div class="srow"><span class="small">जीवन-वर्ष '+L.gameYear+'/5</span><span class="pill">उम्र: '+L.age+' साल</span></div><div class="grid"><div class="st">💰 पैसा <b'+(L.money<0?' style="color:#c0392b"':'')+'>₹'+fmt(L.money)+'</b><div class="bar"><i style="width:'+(L.money<=0?0:mp)+'%;background:#f2b134"></i></div></div>'+bar('❤️ सेहत',L.h,L.h<30?'#e74c3c':'#2ecc71')+bar('😊 खुशी',L.j,'#5b9cff')+bar('🤝 रिश्ते',L.r,'#c86bfa')+'</div>'}
function fxHtml(d){if(!d)return '';var a=[];if(d[0])a.push('<span class="'+(d[0]>0?'p':'n')+'">'+(d[0]>0?'+':'-')+'₹'+fmt(Math.abs(d[0]))+'</span>');var n=['','सेहत','खुशी','रिश्ते'];for(var i=1;i<4;i++)if(d[i])a.push('<span class="'+(d[i]>0?'p':'n')+'">'+(d[i]>0?'+':'')+d[i]+' '+n[i]+'</span>');return a.length?'<div class="fx">'+a.join('')+'</div>':''}
function render(){if(!ME)return;viewP=false;renderStats();clearInterval(waitT);setTimeout(function(){if(ZONE&&tab==='life'&&ME.state==='alive'){var a=$('app');if(a&&!$('zoneBanner')){var d=document.createElement('div');d.id='zoneBanner';d.textContent='📍 '+ZONE;a.insertBefore(d,a.firstChild)}}},0);
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',PANEL&&b.dataset.tab===tab)});
 ({life:rLife,world:rWorld,people:rPeople,chat:rChat})[tab]()}
function rLife(){var h='';
 if(ME.state==='preg'){var p=ME.preg,skew=Date.now()-p.now,tot=p.end-p.start;
  var ms='';for(var i=1;i<=9;i++)ms+='<span class="'+(i<=p.month?'on':'')+'"></span>';

function mkPC(){var pc=new RTCPeerConnection({iceServers:ICE});
 pc.onicecandidate=function(e){if(e.candidate&&C)S({t:'rtc',to:C.peer,kind:'ice',data:e.candidate})};
 pc.ontrack=function(e){$('remote').srcObject=e.streams[0]};

 C.stream.getTracks().forEach(function(t){pc.addTrack(t,C.stream)});return pc}

function rtc(m){var k=m.kind;
 if(k==='ring'){if(C)return S({t:'rtc',to:m.from,kind:'busy'});C={peer:m.from,name:m.fromName,out:false,pending:[]};
  callUI('<div class="big">📲</div><h2 style="color:#fff">'+esc(m.fromName)+'</h2><p>आपको कॉल कर रहे हैं…</p><button class="btn grn c" id="ac">✅ उठाएँ</button><button class="btn red c" id="dc">❌ मना करें</button>');
  $('ac').onclick=function(){getMic().then(function(s){if(!C)return;C.stream=s;C.pc=mkPC();S({t:'rtc',to:C.peer,kind:'accept'});callUI('<div class="big">⏳</div><p>जोड़ रहे हैं…</p><button class="btn red c" id="hu">📴</button>');$('hu').onclick=function(){endCall(true)}}).catch(function(e){S({t:'rtc',to:C.peer,kind:'decline'});endCall(false,'माइक अनुमति नहीं मिली: '+e.message)})};
  $('dc').onclick=function(){S({t:'rtc',to:C.peer,kind:'decline'});endCall(false)};return}
 if(!C||m.from!==C.peer)return;
 if(k==='accept'&&C.out){getMic().then(function(s){C.stream=s;C.pc=mkPC();return C.pc.createOffer()}).then(function(o){return C.pc.setLocalDescription(o).then(function(){S({t:'rtc',to:C.peer,kind:'offer',data:o})})}).catch(function(e){endCall(true,'माइक अनुमति नहीं मिली: '+e.message)})}
 else if(k==='offer'&&C.pc){C.pc.setRemoteDescription(m.data).then(function(){flushIce();return C.pc.createAnswer()}).then(function(a){return C.pc.setLocalDescription(a).then(function(){S({t:'rtc',to:C.peer,kind:'answer',data:a})})}).catch(function(){endCall(true,'कॉल त्रुटि')})}
 else if(k==='answer'&&C.pc){C.pc.setRemoteDescription(m.data).then(flushIce).catch(function(){})}
 else if(k==='ice')addIce(m.data);
 else if(k==='decline')endCall(false,'कॉल अस्वीकार की गई');
 else if(k==='busy')endCall(false,'व्यस्त हैं');
 else if(k==='unavailable')endCall(false,'वो अभी ऑनलाइन नहीं हैं (सो रहे हैं)');
 else if(k==='hangup')endCall(false,'कॉल समाप्त');
}
