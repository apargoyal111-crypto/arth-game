<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Mukta','Noto Sans Devanagari','Mangal','Nirmala UI',system-ui,sans-serif;background:linear-gradient(180deg,#eef1ff,#f8f4ff);color:#2a2d3e;min-height:100vh;font-size:17px;line-height:1.55;padding-bottom:74px}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 20px}

.tl div{font-size:14px;padding:4px 0;border-bottom:1px dashed #ddd}

.pl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.pl.sl{opacity:.45}
.av{width:44px;height:44px;border-radius:50%;background:#eef0ff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;position:relative}
.av i{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:#bbb}.av i.on{background:#2ecc71}
.pl .nm{flex:1;min-width:0}.pl .nm small{display:block;color:#888;font-size:12px}
.chat{height:52vh;overflow-y:auto;background:#f6f7ff;border-radius:12px;padding:8px;margin-top:8px}

.row{display:flex;gap:8px}.row input{flex:1}.row .btn{width:auto;margin-top:6px}

.feed .li{border-color:#9be3c0}

/* ---- 3D shell: game is always visible, HUD overlays + slide-in drawer ---- */
html,body{height:100%;overflow:hidden}
body{padding:0;background:#9fc7ef;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
#c3d{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

body.full .ctl,body.full nav{display:none!important}

/* ---- premium look ---- */
#load{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 35%,#4b5bdc,#1a1d3a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .6s}
#load .logo,.logo{font-size:88px;font-weight:800;line-height:1.1;background:linear-gradient(135deg,#ffd166,#ff8a3d,#ff4f9a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(255,120,80,.35))}
#load .tag{opacity:.85;margin:4px 0 22px;letter-spacing:.5px}#load .pb{width:min(320px,60vw);height:8px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}
#load .pb i{display:block;height:100%;width:5%;background:linear-gradient(90deg,#ffd166,#ff4f9a);transition:width .3s}#load small{margin-top:10px;opacity:.6;font-size:12px}#load.gone{opacity:0;pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(10,10,30,.36) 100%)}
#stats{background:rgba(18,20,40,.5)!important;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.18)}
#lookb,#qb,#muteB,nav{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.rb{border:2px solid rgba(255,255,255,.4)!important;background-image:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,0));transition:transform .08s,filter .08s}
.rb:active,#lookb:active,#qb:active,#muteB:active,.btn:active,#meet:active{transform:scale(.9)}#actB:active{filter:brightness(.88)}
#actB{background:linear-gradient(135deg,#ffd166,#ff9f1c)!important;border:2px solid rgba(255,255,255,.6)}
#toast{border-radius:20px;background:rgba(20,22,40,.78)!important;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px) scale(.95)}to{opacity:1}}
#muteB{position:fixed;right:8px;top:218px;min-height:36px;padding:4px 10px;border:none;border-radius:18px;background:rgba(255,255,255,.88);color:#3b3f9e;font:inherit;font-weight:700;font-size:12px;z-index:5}
body.full #pw{background:radial-gradient(circle at 50% 20%,#4b5bdc,#1a1d3a 75%)}body.full #app .card{background:rgba(255,255,255,.96);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.35)}body.full #app>p{color:#dfe3ff}
.dv{display:none}body.driving .dv{display:block}body.driving #punchB,body.driving #sitB,body.driving #run,body.driving #actB,body.driving #meet{display:none!important}
#gasB{right:14px;bottom:76px;background:rgba(34,165,101,.92);width:72px;height:72px}#brakeB{right:94px;bottom:76px;background:rgba(229,72,77,.92)}
#exitB{right:14px;bottom:156px;background:rgba(42,45,62,.92)}#hornB{right:94px;bottom:150px;background:rgba(243,156,18,.92)}
/* ---- phone landscape HUD ---- */
#rot{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#3b3f9e,#5b6cff);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;font-weight:700}
#rot .ic{font-size:84px;animation:rot 2s ease-in-out infinite}@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot small{display:block;font-weight:400;font-size:14px;opacity:.85;margin-top:10px}
@media (orientation:portrait) and (pointer:coarse){body:not(.full) #rot{display:flex}}
@media (orientation:landscape) and (max-height:520px){
 :root{--t:max(6px,env(safe-area-inset-top));--l:max(8px,env(safe-area-inset-left));--r:max(8px,env(safe-area-inset-right));--b:max(8px,env(safe-area-inset-bottom))}
 #stats{top:var(--t);left:var(--l);width:168px;padding:4px 8px;font-size:11px}#stats .srow{font-size:11px;margin-bottom:1px}#stats .st{font-size:10px;margin-top:1px}#stats .bar{height:4px}
 #mm{top:var(--t);right:var(--r);width:92px;height:92px}
 #lookb{top:var(--t);right:calc(var(--r) + 100px);min-height:32px}#muteB{top:calc(var(--t) + 76px);right:calc(var(--r) + 100px);min-height:32px}
 #gasB{right:calc(var(--r) + 6px);bottom:calc(var(--b) + 4px);width:66px;height:66px}#brakeB{right:calc(var(--r) + 82px);bottom:calc(var(--b) + 4px)}#exitB{right:calc(var(--r) + 6px);bottom:calc(var(--b) + 80px)}#hornB{right:calc(var(--r) + 78px);bottom:calc(var(--b) + 72px)}#qb{top:calc(var(--t) + 38px);right:calc(var(--r) + 100px);min-height:32px}
 nav{top:var(--t);bottom:auto;left:50%;right:auto;transform:translateX(-50%);height:40px;border-radius:20px;background:rgba(255,255,255,.88);width:auto;box-shadow:0 2px 8px rgba(0,0,0,.2)}
 nav button{min-height:40px;padding:0 10px;font-size:0;flex:none}nav button b{font-size:19px}nav .dot{top:0;right:0}
 #joy{left:calc(var(--l) + 10px);bottom:calc(var(--b) + 4px);width:116px;height:116px}#knob{left:31px;top:31px}
 .rb{width:58px;height:58px;font-size:11px}
 #run{right:calc(var(--r) + 6px);bottom:calc(var(--b) + 4px)}
 #punchB{right:calc(var(--r) + 76px);bottom:calc(var(--b) + 4px)}
 #sitB{right:calc(var(--r) + 6px);bottom:calc(var(--b) + 74px)}
 #actB{left:auto;transform:none;right:calc(var(--r) + 72px);bottom:calc(var(--b) + 70px);min-height:48px;padding:6px 14px;font-size:15px;max-width:170px}
 #meet{bottom:calc(var(--b) + 6px);min-height:40px;font-size:14px}
 #hint{top:calc(var(--t) + 48px);font-size:12px}
 #toast{top:calc(var(--t) + 48px)}
 #pw{top:0;bottom:0;width:max(300px,40vw);border-radius:16px 0 0 16px;padding-right:env(safe-area-inset-right)}
 body.drawer nav{right:auto;left:calc((100vw - max(300px,40vw))/2);}
 body.full #pw{width:100%}
}
@media (orientation:landscape) and (max-height:380px){#joy{width:100px;height:100px}#knob{left:23px;top:23px}#stats{width:150px}.rb{width:52px;height:52px}#punchB{right:calc(var(--r) + 66px)}#sitB{bottom:calc(var(--b) + 64px)}#actB{right:calc(var(--r) + 64px);bottom:calc(var(--b) + 62px);font-size:14px}}
</style></head><body>

<script>
"use strict";
var PANEL=true,DRAWER=false,ZONE=null;function mustPanel(){return !ME}

function fitPanel(){}
window.openLife=function(){};window.onPoses=null;window.onFeed=null;
var viewP=false,ws=null,ME=null,W={feed:[]},PL=[],TOK=null,ICE=[{urls:'stun:stun.l.google.com:19302'}],tab='life',chatWith=null,HIST={},unread={},gsel='r',retry=0,waitT=null,lastMeAt=0;

 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
